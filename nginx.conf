events {}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript text/xml application/xml application/xml+rss image/svg+xml font/woff font/woff2;

    server {
        listen 80;
        client_max_body_size 50m;

        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-ugCypV+0vdZhfsFJJPpwUcqE54KBTg/rrjVD9+cVcfo='; script-src-attr 'unsafe-hashes' 'sha256-ugCypV+0vdZhfsFJJPpwUcqE54KBTg/rrjVD9+cVcfo='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http: https:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        location = /health {
            return 200 'ok';
        }

        location ~* /\.(git|svn|hg|bzr)(/|$) {
            return 404;
        }

        location ~* (^|/)(CVS|\.DS_Store|\.env|\.env\..*|\.htpasswd|\.htaccess|\.bash_history|\.sh_history|\.mysql_history|\.psql_history|\.sqlite_history)$ {
            return 404;
        }

        location ~* \.(bak|backup|old|orig|save|swp|tmp|sql|sqlite|db)$ {
            return 404;
        }

        location ~* (^|/)(users|accounts|credentials|passwords|secrets|tokens)\.json$ {
            return 404;
        }

        location ~* \.(css|js|mjs|map|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-ugCypV+0vdZhfsFJJPpwUcqE54KBTg/rrjVD9+cVcfo='; script-src-attr 'unsafe-hashes' 'sha256-ugCypV+0vdZhfsFJJPpwUcqE54KBTg/rrjVD9+cVcfo='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http: https:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
