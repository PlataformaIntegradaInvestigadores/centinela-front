name: CI — frontend-app

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    uses: PlataformaIntegradaInvestigadores/.github/.github/workflows/branch-name.yml@main

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Pruebas unitarias (Karma/Jasmine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Ejecutar tests
        # ubuntu-latest ya trae Chrome instalado, evita descargar chromium-browser via apt
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
        run: |
          npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox \
            --no-progress --code-coverage
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/

  # ── Docker build ─────────────────────────────────────────────────────────────
  build-docker:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Build imagen
        run: docker build -t frontend-app:${{ github.sha }} .
      - name: Verificar imagen
        run: docker images frontend-app

  # ── Deploy staging ───────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy a servidor staging
    runs-on: [self-hosted, staging]
    needs: test
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Actualizar codigo
        run: |
          cd /opt/centinela/centinela-front
          git fetch origin develop
          git reset --hard origin/develop

      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela
          docker compose up -d --build --no-deps centinela-front

      - name: Health check
        run: |
          sleep 15
          HEALTHY=false
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8082 || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido — rollback"
            cd /opt/centinela/centinela-front && git reset --hard HEAD~1
            cd /opt/centinela && docker compose up -d --build --no-deps centinela-front
            exit 1
          fi
