<div
  *ngIf="open"
  class="fixed inset-0 z-[200001] flex items-center justify-center bg-black/40 px-4"
  role="dialog"
  aria-modal="true"
  (click)="cancel()"
>
  <div class="w-full max-w-md bg-white rounded-lg shadow-xl p-5" (click)="$event.stopPropagation()">
    <h3 class="text-base font-semibold text-gray-900">
      <i class="fas fa-flag text-amber-500 mr-2"></i>Report {{ subject }}
    </h3>
    <p class="text-sm text-gray-500 mt-1">
      Tell us why you find it offensive. A moderator will review it.
    </p>
    <textarea
      [(ngModel)]="reason"
      rows="3"
      maxlength="255"
      placeholder="Reason (optional)"
      class="w-full mt-3 p-3 bg-gray-100 rounded-lg resize-none text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
    ></textarea>
    <p *ngIf="error" class="mt-2 text-sm text-red-600">{{ error }}</p>
    <div class="flex justify-end gap-2 mt-4">
      <button
        type="button"
        class="px-4 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100"
        (click)="cancel()"
      >
        Cancel
      </button>
      <button
        type="button"
        class="px-4 py-2 rounded-md text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 disabled:opacity-60"
        [disabled]="isSubmitting"
        (click)="submit()"
      >
        <i class="fas fa-spinner fa-spin mr-1" *ngIf="isSubmitting"></i>Report
      </button>
    </div>
  </div>
</div>
