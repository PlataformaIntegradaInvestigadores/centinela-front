services:
  centinela-front:
    build: .
    container_name: centinela-front
    ports:
      - '127.0.0.1:8082:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - centinela-net

networks:
  centinela-net:
    external: true
